[package]
name = "singularity"
version = "0.1.0"
description = "Next-Gen Agentic Desktop — orchestration workspace for autonomous AI agents"
authors = ["Singularity"]
edition = "2021"

[lib]
name = "singularity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
