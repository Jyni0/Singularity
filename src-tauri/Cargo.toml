[package]
name = "singularity"
version = "0.9.0"
description = "Next-Gen Agentic Desktop — orchestration workspace for autonomous AI agents"
authors = ["Singularity"]
edition = "2021"

[lib]
name = "singularity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "net", "io-util", "process"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false }
futures-util = "0.3"
bytes = "1"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"
tiny_http = "0.12"
# Local speech-to-text: whisper.cpp bindings + container/codec decoding.
# Everything runs on-device; no cloud transcription service is ever called.
whisper-rs = "0.16"
symphonia = { version = "0.5", features = ["wav", "pcm"] }
# Direct access to the app database from Rust (MCP server secrets) without
# a frontend round-trip. Same version the sql plugin uses: one sqlx build.
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
regex = "1"
keyring = "4.2.0"
aes-gcm = "0.11.1"
# Console-output decoding: Windows cmd.exe prints in the OEM codepage (cp866
# for a Russian locale), never UTF-8 — decoding it as UTF-8 produced the
# "кириллица выглядит как мусор" bug.
encoding_rs = "0.8"
rig-core = "0.42"
rig-agent = "0.42"
# Structured logs (agent steps, token spend, guard / context-editing events).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Unpacking the vendor CLIs' npm tarballs (cli/install.rs).
tar = "0.4"
flate2 = "1"
tauri-plugin-single-instance = "2"
tree-sitter = "0.27.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-json = "0.24.8"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-bash = "0.25.1"
tree-sitter-html = "0.23.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-php = "0.24.2"

# WebView2 hooks (same versions wry uses): take Ctrl+F / Ctrl+G / F3 away
# from the browser's own find bar so the app's search gets them.
[dev-dependencies]
# Scripted MockCompletionModel for the agent loop tests.
rig-core = { version = "0.42", features = ["test-utils"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
# Job objects: stopping a background task kills everything it started
# (bash → npm → cmd → node survived taskkill /T).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }
