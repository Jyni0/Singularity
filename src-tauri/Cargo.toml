[package]
name = "singularity"
version = "0.2.0"
description = "Next-Gen Agentic Desktop — orchestration workspace for autonomous AI agents"
authors = ["Singularity"]
edition = "2021"

[lib]
name = "singularity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false }
futures-util = "0.3"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"
tiny_http = "0.12"
# Local speech-to-text: whisper.cpp bindings + container/codec decoding.
# Everything runs on-device; no cloud transcription service is ever called.
whisper-rs = "0.16"
symphonia = { version = "0.5", features = ["wav", "pcm"] }
# SSH client for "SSH Client" mode. The default aws-lc-sys crypto needs NASM
# on Windows; ring builds with plain MSVC toolchain, so pin it.
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
# Direct read access to the app database for the SSH module (agent tool +
# connect command need server credentials without a frontend round-trip).
# Same version the sql plugin uses, so one sqlx build serves both.
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
russh-sftp = "3.0.0"
keyring = "4.2.0"
aes-gcm = "0.11.1"
# Console-output decoding: Windows cmd.exe prints in the OEM codepage (cp866
# for a Russian locale), never UTF-8 — decoding it as UTF-8 produced the
# "кириллица выглядит как мусор" bug.
encoding_rs = "0.8"
